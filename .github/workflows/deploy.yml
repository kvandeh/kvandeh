name: Deploy to kcvdh.com

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege permissions the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; newer pushes cancel in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Turns articles/*/index.md into pages, refreshes the carousel, footer and sitemap.
      - name: Build articles
        run: pip install markdown && python3 build.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The site is plain static files at the repo root (index.html, styles.css,
      # resume/, assets/, CNAME, .nojekyll). Ship the whole root as-is.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # Tell Bing, Yandex and other IndexNow engines the pages changed.
      - name: Ping IndexNow
        run: |
          URLS=$(grep -o 'https://kcvdh.com/[^<]*' sitemap.xml | sed 's/.*/"&"/' | paste -sd,)
          curl -sS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"kcvdh.com\",\"key\":\"12b6164e53b149f6b7ea5543f1d5cc12\",\"keyLocation\":\"https://kcvdh.com/12b6164e53b149f6b7ea5543f1d5cc12.txt\",\"urlList\":[$URLS]}" \
            -w 'IndexNow HTTP %{http_code}\n'
