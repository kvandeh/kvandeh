name: Deploy to kcvdh.com

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'  # daily, keeps /contributions fresh

# Least-privilege permissions the Pages deploy needs.
permissions:
  contents: read
  actions: write  # lets the run re-enable its own schedule (see the last step)
  pages: write
  id-token: write

# Only one deploy at a time; newer pushes cancel in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Builds articles, pages/*.md, /contributions (GitHub API), the footer and the sitemap.
      - name: Build site
        run: pip install markdown jinja2 && python3 build.py
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The site is plain static files at the repo root (index.html, styles.css,
      # resume/, assets/, CNAME, .nojekyll). Ship the whole root as-is.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # Tell Bing, Yandex and other IndexNow engines the pages changed.
      - name: Ping IndexNow
        run: |
          URLS=$(grep -o 'https://kcvdh.com/[^<]*' sitemap.xml | sed 's/.*/"&"/' | paste -sd,)
          curl -sS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"kcvdh.com\",\"key\":\"12b6164e53b149f6b7ea5543f1d5cc12\",\"keyLocation\":\"https://kcvdh.com/12b6164e53b149f6b7ea5543f1d5cc12.txt\",\"urlList\":[$URLS]}" \
            -w 'IndexNow HTTP %{http_code}\n'

      # GitHub switches off cron schedules after 60 days without repo activity.
      # Re-enabling the workflow on every run resets that clock, so /contributions never goes stale.
      - name: Keep the daily schedule alive
        run: gh workflow enable deploy.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
